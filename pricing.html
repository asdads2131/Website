<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prompee - Payment</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #1C1C21;
      color: white;
      padding: 40px;
    }

    .card {
      background: #1F1F26;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #111;
      border: 1px solid #333;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: linear-gradient(90deg, #26A7F0, #F59A47);
      color: white;
      cursor: pointer;
    }

    .error {
      color: orange;
      display: none;
    }
  </style>
</head>

<body>

<h1>Prompee</h1>

<div class="card">
  <h2>Programmer Bundle</h2>
  <input type="email" placeholder="Your email" class="email">
  <p class="error">Invalid email</p>
  <button onclick="buy(29.75, this, 'Programmer Bundle')">Buy</button>
</div>

<div class="card">
  <h2>Research Bundle</h2>
  <input type="email" placeholder="Your email" class="email">
  <p class="error">Invalid email</p>
  <button onclick="buy(11.90, this, 'Research Bundle')">Buy</button>
</div>

<div class="card">
  <h2>Programmer Lite</h2>
  <input type="email" placeholder="Your email" class="email">
  <p class="error">Invalid email</p>
  <button onclick="buy(22.61, this, 'Programmer Lite')">Buy</button>
</div>

<script>
const BACKEND = "https://backend2-production-2dbb.up.railway.app/api/emails";

async function buy(amount, btn, product) {
  const card = btn.closest(".card");
  const emailInput = card.querySelector(".email");
  const error = card.querySelector(".error");

  const email = emailInput.value.trim();

  if (!email.includes("@")) {
    error.style.display = "block";
    return;
  }

  error.style.display = "none";

  try {
    await fetch(BACKEND, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: email,
        product: product,
        amount: amount
      })
    });

    alert("Saved. Redirecting...");

  } catch (e) {
    alert("Error connecting to backend");
  }
}
</script>

</body>
</html>
